services:
  api:
    build: .
    env_file: .env
    ports:
      - "4000:4000"
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @supportai/web dev"
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
